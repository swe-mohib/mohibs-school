services:
  client:
    image: docker.io/${DOCKERHUB_USERNAME}/mohibs-school-client:latest
    container_name: client
    restart: unless-stopped
    expose:
      - "80"
    depends_on:
      - server
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:80/"]
      interval: 30s
      timeout: 5s
      retries: 3

  server:
    image: docker.io/${DOCKERHUB_USERNAME}/mohibs-school-server:latest
    container_name: server
    restart: unless-stopped
    env_file: .env.server
    expose:
      - "5000"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:5000/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

  nginx:
    image: nginx:alpine
    container_name: nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - /etc/letsencrypt:/etc/letsencrypt:ro
    depends_on:
      - client
      - server
